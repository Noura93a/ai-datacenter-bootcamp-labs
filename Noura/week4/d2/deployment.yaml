apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app: serving
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: serving
    spec:
      containers:
        - name: serving
          image: noura93/aidc-serving:cpu-v1
          ports:
            - containerPort: 8000
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          env:
            - name: MODEL_BACKEND
              value: "echo"
            - name: MODEL_ID
              value: "Qwen/Qwen2.5-0.5B-Instruct"
            - name: APP_VERSION
              value: "v1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 5